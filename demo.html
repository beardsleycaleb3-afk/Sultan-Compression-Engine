<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sultan-v88 // Mobile Touch Spec</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; frame-ancestors 'self';">
    <link rel="stylesheet" href="shared/sultan-theme.css">
    <style>
        * { box-sizing: border-box; touch-action: manipulation; }
        body { overflow: hidden; height: 100vh; }
        
        /* Responsive Canvas */
        #canvas-wrap { width: 90vw; height: 90vw; max-width: 400px; max-height: 400px; background: #050505; margin-top: 10px; border-width: 1px; }
        canvas { width: 100%; height: 100%; }

        /* Mobile Controls */
        #ui-layer { width: 100%; padding: 15px; display: flex; flex-direction: column; align-items: center; flex-grow: 1; justify-content: space-around; }
        .btn-row { display: flex; gap: 10px; width: 100%; max-width: 400px; }
        .btn-row button { flex: 1; padding: 20px; }
        #manifestBtn { width: 100%; max-width: 400px; padding: 20px; }
        
        #console { width: 90vw; max-width: 400px; height: 100px; font-size: 10px; padding: 5px; }
        
        .toggle-row { display: flex; align-items: center; gap: 10px; font-size: 12px; margin-top: 10px; }
        input[type="checkbox"] { transform: scale(1.5); }
    </style>
</head>
<body>

    <div id="canvas-wrap" class="sultan-canvas-wrap">
        <canvas id="sultanCanvas" width="400" height="400"></canvas>
    </div>

    <div id="ui-layer">
        <div id="console" class="sultan-console">BOOTING SULTAN-v88...</div>

        <div class="btn-row">
            <button id="foldBtn" class="sultan-btn-outline">FOLD (3000:1)</button>
            <button id="unfoldBtn" class="sultan-btn-outline">UNFOLD (018810)</button>
        </div>

        <button id="manifestBtn" class="sultan-btn-outline">EXPORT SEAL (8oOOo8)</button>

        <div class="toggle-row">
            <input type="checkbox" id="kbMouseToggle">
            <label for="kbMouseToggle">ENABLE MOUSE/KB INPUT</label>
        </div>
    </div>

<script src="shared/sultan-core.js"></script>
<script>
const { ctx } = initCanvas('sultanCanvas');
const toggle = document.getElementById('kbMouseToggle');
const log = createLogger('console');

let isFolding = false;
let foldScale = 1.0;
const center = 200;
let frame = 0;

// Input Gatekeeper
const preventInput = (e) => {
    if (!toggle.checked) {
        if (e.type.startsWith('key') || e.type.startsWith('mouse')) {
            e.preventDefault();
            return false;
        }
    }
};

window.addEventListener('keydown', preventInput, true);
window.addEventListener('mousedown', preventInput, true);

// Sultan Core Logic
document.getElementById('foldBtn').ontouchstart = () => {
    isFolding = true;
    log("FOLDING: Collapsing to Diamond Equilibrium...");
};

document.getElementById('unfoldBtn').ontouchstart = () => {
    isFolding = false;
    log("UNFOLDING: Reconstructing from Mirror Spec...");
};

document.getElementById('manifestBtn').ontouchstart = () => {
    downloadJSON(
        { seal: SULTAN_CONFIG.seal, status: "Verified" },
        'SULTAN_MOBILE_EXPORT.json'
    );
    log(`${SULTAN_CONFIG.seal} SEAL DOWNLOADED.`);
};

function animate() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
    ctx.fillRect(0, 0, 400, 400);

    // Dynamic Folding Math
    if (isFolding && foldScale > 0.05) foldScale -= 0.02;
    if (!isFolding && foldScale < 1.0) foldScale += 0.02;

    const time = Date.now() * 0.002;
    
    ctx.save();
    ctx.translate(center, center);
    ctx.scale(foldScale, foldScale);

    // Crosshair Anchors
    ctx.strokeStyle = 'rgba(0, 255, 65, 0.4)';
    ctx.strokeRect(-180, -1, 360, 2);
    ctx.strokeRect(-1, -180, 2, 360);

    // Diamond Lattice
    ctx.strokeStyle = '#00FF41';
    for(let i=0; i<6; i++) {
        ctx.rotate(time * 0.2 + (i * Math.PI / 3));
        ctx.strokeRect(-50 - (i*20), -50 - (i*20), 100 + (i*40), 100 + (i*40));
    }
    
    ctx.restore();
    
    if (frame % 60 === 0) {
        if(isFolding) log("Symmetry Collapse Active...");
    }

    frame++;
    requestAnimationFrame(animate);
}

log("Touch Interface Ready.");
log("Mouse/KB Locked by default.");
animate();
</script>
</body>
</html>
